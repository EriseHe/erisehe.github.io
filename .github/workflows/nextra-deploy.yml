name: Deploy Nextra site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the featured "Setup Node.js environment" action with specific settings for native deps
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'  # Specific LTS version for stability
          architecture: 'x64'      # Explicitly set x64 architecture for native binaries
          cache: 'npm'             # Enable npm caching
          cache-dependency-path: 'package-lock.json'  # Specific cache path
          check-latest: false      # Don't check for latest to ensure consistency

      # Use the featured "Cache" action for better dependency management
      - name: Cache dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .next/cache
            node_modules
          key: ${{ runner.os }}-nextra-x64-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/*.md', '**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextra-x64-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextra-x64-

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      # Install system dependencies needed for native modules compilation
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ git build-essential

      # Clear any cached dependencies that might be architecture-mismatched
      - name: Clear npm cache
        run: npm cache clean --force

      # Install dependencies with specific flags for native modules
      - name: Install dependencies
        env:
          NEXT_TELEMETRY_DISABLED: 1
          CI: true
          npm_config_target_platform: linux
          npm_config_target_arch: x64
          npm_config_build_from_source: true
        run: |
          npm ci --legacy-peer-deps --verbose
          
      # Rebuild native dependencies specifically for Linux x64
      - name: Rebuild native dependencies
        run: |
          npm rebuild @napi-rs/simple-git --verbose || echo "Rebuild failed, continuing..."
          ls -la node_modules/@napi-rs/ || echo "No @napi-rs directory found"

      - name: Build with Next.js
        env:
          NEXT_TELEMETRY_DISABLED: 1
          CI: true
          NODE_ENV: production
        run: |
          npm run export
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 