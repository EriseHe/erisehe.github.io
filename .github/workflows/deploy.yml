name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  # Disable operations that might trigger native dependencies
  NEXT_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 git
        
    - name: Clear npm cache and install dependencies
      run: |
        npm cache clean --force
        rm -rf node_modules package-lock.json
        npm install --legacy-peer-deps --no-optional
        
    - name: Try to rebuild native modules if they exist
      run: |
        npm rebuild || echo "Rebuild failed, continuing anyway"
        
    - name: Verify installation and debug
      run: |
        npm ls --depth=0 || true
        node -e "console.log('Node.js version:', process.version, 'Platform:', process.platform, 'Arch:', process.arch)"
        ls -la node_modules/@napi-rs/ || echo "No @napi-rs modules found"
        
    - name: Build static site with fallbacks
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
      run: |
        npm run export || {
          echo "Build failed, trying with git disabled"
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          npm run export
        }
      
    - name: Add .nojekyll file
      run: touch ./out/.nojekyll
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out 