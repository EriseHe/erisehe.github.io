name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  # Disable git operations that might trigger native dependencies
  DISABLE_ESLINT_PLUGIN: true
  NEXT_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3
        
    - name: Install dependencies with native module fixes
      run: |
        npm ci --legacy-peer-deps
        npm rebuild
        npm install --platform=linux --arch=x64 @napi-rs/simple-git-linux-x64-gnu || true
        
    - name: Verify installation
      run: |
        npm ls --depth=0
        node -e "console.log('Node.js version:', process.version, 'Platform:', process.platform, 'Arch:', process.arch)"
        
    - name: Build static site
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
      run: npm run export
      
    - name: Add .nojekyll file
      run: touch ./out/.nojekyll
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out 